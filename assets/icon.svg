<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#171717"/>
  
  <!-- Code Court triangle/chevron pattern - simplified and scaled -->
